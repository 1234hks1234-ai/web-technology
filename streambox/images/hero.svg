      <stop offset="1" stop-color="#5b2a9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a0d"/>
      <stop offset="1" stop-color="#0b0b1a"/>
